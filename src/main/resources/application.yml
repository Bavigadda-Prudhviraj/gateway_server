management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: "gatewayserver"
    description: "Save Money Bank Gateway Server Application"
    version: "1.0.0"

logging:
  level:
    # Your custom gateway code (package)
    org.prudhviraj.gatewayserver: DEBUG

    # Core Spring Cloud Gateway internals: routes, filters, predicates
    org.springframework.cloud.gateway: DEBUG

    # Load Balancer (Spring Cloud LoadBalancer)
    org.springframework.cloud.client.loadbalancer: DEBUG

    # Eureka client registration and discovery logs
    org.springframework.cloud.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
    com.netflix.eureka: DEBUG

    # Web-related logging (request/response level)
    org.springframework.web: DEBUG
    org.springframework.http: DEBUG
    org.springframework.boot.autoconfigure.web: DEBUG

    # Spring Security - useful if you're using secure endpoints at Gateway
    org.springframework.security: DEBUG

    # Reactor Netty for gateway (if using WebFlux/reactive stack)
    reactor.netty: DEBUG

    # Spring Boot actuator endpoints (if you're using them to monitor)
    org.springframework.boot.actuate.endpoint: DEBUG
    org.springframework.boot.actuate.endpoint.web: DEBUG
resilience4j.circuitbreaker:
  config:
    default: # Name of the configuration preset (can be reused by multiple circuit breakers)
      slidingWindowSize: 10
      # The number of calls that will be recorded in the sliding window.
      # In this case, the last 10 calls will be considered to calculate failure rate.
      # Useful for defining how much recent history you want to base decisions on.

      permittedNumberOfCallsInHalfOpenState: 2
      # When the circuit is HALF-OPEN (testing if service has recovered),
      # this is the max number of trial calls allowed before deciding to fully OPEN or CLOSE again.
      # Example: Allow only 2 requests to check if service is healthy.

      failureRateThreshold: 50
      # The percentage of calls that must fail before the circuit breaker opens.
      # Here: If 50% or more of the last `slidingWindowSize` calls fail, the circuit goes OPEN.

      waitDurationInOpenState: 10s
      # The time the circuit breaker will wait in OPEN state before switching to HALF-OPEN.
      # Example: Wait 10 seconds before trying a test call to see if the service is back.
